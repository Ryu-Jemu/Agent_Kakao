name: Record PR evidence in Notion

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to collect from the GitHub API
        required: true
        type: string
      run_id:
        description: Exact CI run ID (optional; omit to query current head runs)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

# Serialize every writer, including manual recovery. queue:max preserves up to
# 100 pending runs. Overflow/cancelled runs must be recovered via dispatch.
concurrency:
  group: notion-records
  cancel-in-progress: false
  queue: max

jobs:
  document:
    if: github.repository == 'Ryu-Jemu/Agent_Kakao'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted collector from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Collect API evidence and publish within the allowed Notion parent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ vars.NOTION_PARENT_PAGE_ID }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CI_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args=(--pr "$PR_NUMBER")
            if [[ -n "$CI_RUN_ID" ]]; then
              args+=(--run-id "$CI_RUN_ID")
            fi
          else
            args=(--event-file "$GITHUB_EVENT_PATH")
          fi
          python -m automation.cli sync "${args[@]}" --output artifacts/evidence.json
      - name: Preserve collected evidence even when Notion fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*.json
          if-no-files-found: ignore
          retention-days: 30
