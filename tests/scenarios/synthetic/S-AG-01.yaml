    - {id: S2, basis: expected, text: "미출고분을 배송 담당에 확인 요청했고 확인 후 회신한다고 안내한다"}
    - {id: S3, basis: expected, text: "오늘 발송·도착을 확답할 수 없다고 정직하게 안내한다"}
