  - 인입 계정: 비회원(로그인 전)

  어제 회원가입 했는데 로그인이 안 돼요. 비밀번호 분명히 맞게 넣었어요.
inquiry: 어제 회원가입 했는데 로그인이 안 돼요. 비밀번호 분명히 맞게 넣었어요.
situation: |
  로그인 불가 처리 절차는 KB 미확정(❓, policy_pack §8). 인입 계정이 비회원이라 본인 확인 전이다.
  봇은 절차를 지어내지 말고 상황(가입 수단·오류 문구)을 확인하고, 확인되지 않은 절차는 담당자 확인으로 넘긴다. 비밀번호를 묻지 않는다.
expected: |
  1. 불편에 공감·사과 2. 가입 방법·오류 메시지 등 상황 확인 질문 3. 비밀번호·인증번호를 요구하지 않는다 4. 모르는 절차는 지어내지 않고 담당자 확인·이관 등으로 안내
