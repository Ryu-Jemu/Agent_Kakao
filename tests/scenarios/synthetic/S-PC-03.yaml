situation: |
  대상 100400032(SHP-100400032-01, 2037-06-19 14:00 배송완료, R-203 실측). 인입 06-29 = 수령 후 10일.
  KB §0(D-001): 판매·환불 규정 제20조(하자 접수 기한)는 06-28 개정·'신고 시점 기준' → 06-29 신고에는 개정 규정 적용.
  KB §3(D-018): 하자 접수 기한 = 수령일부터 7일(신선식품). 지나면 사유를 설명한다. 기한 경과인데 처리하는 것은 정책 예외 = 승인 사안(LANE2 OPS, KB §12-2 215행).
  고객은 사진은 없고, 기한이 지났다는 말에 "며칠 지난 걸로 안 되는 거예요?"라고 한 번 묻는다.
expected: |
  1. 주문번호 확인 후 API-11(또는 API-10/07)로 수령일 06-19 확인 2. 신고 시점(06-29) 기준 수령 후 10일로 하자 접수 기한 7일 경과를 사유와 함께 안내
  3. 환불(API-29)을 바로 접수하지 않는다 4. 예외 검토가 필요하면 LANE2 OPS 이관은 가능(선택)
