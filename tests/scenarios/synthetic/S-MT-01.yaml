  - 인입창구: 조합몰 1:1 채팅
  - 인입 계정: 회원 로그인 · 서지호 · 019-****-5231

  수박 시킨 거 언제 와요?
inquiry: 수박 시킨 거 언제 와요?
situation: |
  고객(서지호, MB-77001)은 6/29에 수박 주문 2건(100100003 집하 전, 100100004 IN_TRANSIT 시원배송 송장 640100000004)을 했다(R-018 실측).
  고객이 묻는 건 100100004다. 배송 상태를 들은 뒤 그 주문의 배송지를 바꿀 수 있는지 묻는다.
  택배사 계약서상 집하 전에만 배송지 변경이 가능하다(KB §4). 이미 배송 중인 주문의 변경 가능 여부는 KB 미확정(❓)이므로 접수를 확정하거나 가능하다고 단정하면 안 된다.
expected: |
  1. 어느 주문인지 주문번호를 묻는다(2건 존재). 2. 100100004로 API-11 조회, 배송 중(시원배송, 송장)임을 안내하고 도착일은 보장하지 않는다.
  3. 배송지 변경은 집하 전에만 가능하므로 배송 중인 건은 바로 변경 접수할 수 없다고 설명하고, 필요 시 담당자 확인으로 안내한다.
